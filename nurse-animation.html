<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Empowered Nurses Save Lives</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700;900&family=Cormorant+Garamond:ital,wght@0,600;1,400;1,700&family=Rajdhani:wght@500;700&display=swap');

:root {
  --gold: #ffd700;
  --gold2: #ffb300;
  --cyan: #00e5ff;
  --red: #ff1744;
  --white: #ffffff;
  --deep: #010820;
  --mid: #04194a;
}

*, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }

body {
  background: var(--deep);
  display: flex; justify-content: center; align-items: center;
  min-height: 100vh;
  overflow: hidden;
  font-family: 'Rajdhani', sans-serif;
}

/* ── CANVAS ── */
canvas#particles {
  position: fixed; inset: 0; z-index: 0; pointer-events: none;
}

/* ── POSTER WRAP ── */
.poster {
  position: relative;
  width: min(680px, 98vw);
  aspect-ratio: 680 / 900;
  background: radial-gradient(ellipse at 50% 30%, #0d2060 0%, #020c30 60%, #010820 100%);
  border-radius: 16px;
  overflow: hidden;
  box-shadow: 0 0 80px rgba(0,200,255,0.2), 0 0 200px rgba(0,80,200,0.1), inset 0 0 60px rgba(0,0,0,0.5);
  z-index: 1;
}

/* ── ANIMATED BORDER ── */
.poster::before {
  content:'';
  position: absolute; inset: 0;
  border-radius: 16px;
  background: conic-gradient(from 0deg, transparent 0%, var(--cyan) 20%, transparent 40%,
    var(--gold) 60%, transparent 80%, var(--cyan) 100%);
  padding: 2px;
  -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
  -webkit-mask-composite: xor;
  mask-composite: exclude;
  animation: borderSpin 4s linear infinite;
  z-index: 20;
}
@keyframes borderSpin { to { transform: rotate(360deg); } }

/* ── BACKGROUND PULSE RINGS ── */
.ring {
  position: absolute;
  border-radius: 50%;
  border: 1px solid rgba(0,229,255,0.12);
  top: 38%; left: 50%;
  transform: translate(-50%,-50%) scale(0);
  animation: ringExpand 5s ease-out infinite;
}
.ring:nth-child(1){ width:200px; height:200px; animation-delay: 0s; }
.ring:nth-child(2){ width:350px; height:350px; animation-delay: 1.2s; }
.ring:nth-child(3){ width:500px; height:500px; animation-delay: 2.4s; }
.ring:nth-child(4){ width:650px; height:650px; animation-delay: 3.6s; }
@keyframes ringExpand {
  0%   { transform: translate(-50%,-50%) scale(0); opacity:0.7; }
  100% { transform: translate(-50%,-50%) scale(1); opacity:0; }
}

/* ── RAYS ── */
.rays-wrap {
  position: absolute;
  top: 38%; left: 50%;
  transform: translate(-50%,-50%);
  width: 700px; height: 700px;
  animation: slowSpin 40s linear infinite;
}
@keyframes slowSpin { to{ transform: translate(-50%,-50%) rotate(360deg); } }

/* ── NURSE SVG ── */
.nurse-wrap {
  position: absolute;
  bottom: 22%;
  left: 50%;
  transform: translateX(-50%);
  width: 54%;
  animation: floatNurse 4s ease-in-out infinite;
  filter: drop-shadow(0 0 24px rgba(0,229,255,0.35));
  z-index: 5;
}
@keyframes floatNurse {
  0%,100% { transform: translateX(-50%) translateY(0); }
  50%      { transform: translateX(-50%) translateY(-14px); }
}

/* ── HEARTBEAT BAR ── */
.hb-bar {
  position: absolute;
  bottom: 19%; left: 0; right: 0;
  height: 50px;
  z-index: 6;
  overflow: hidden;
}
.hb-bar svg { width:100%; height:100%; }
.hb-path {
  stroke-dasharray: 900;
  stroke-dashoffset: 900;
  animation: drawHB 2s ease forwards 1.5s, hbLoop 3s ease-in-out infinite 3.5s;
}
@keyframes drawHB { to{ stroke-dashoffset: 0; } }
@keyframes hbLoop {
  0%,100% { stroke-dashoffset: 0; opacity:1; }
  50%     { stroke-dashoffset: 0; opacity:0.6; }
}

/* ──────── SLOGAN SECTION ──────── */
.slogan-section {
  position: absolute;
  bottom: 0; left: 0; right: 0;
  height: 22%;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  gap: clamp(4px, 1.2vw, 10px);
  z-index: 10;
  padding-bottom: 2%;
  background: linear-gradient(to top, rgba(1,8,32,0.95) 60%, transparent 100%);
}

/* Main slogan words — each letter animated */
.slogan-main {
  display: flex; gap: clamp(6px,1.5vw,18px);
  flex-wrap: wrap; justify-content: center;
}

.word-block {
  display: inline-flex;
  overflow: hidden;
}

.slogan-letter {
  display: inline-block;
  font-family: 'Cinzel Decorative', serif;
  font-size: clamp(18px, 4.2vw, 32px);
  font-weight: 700;
  color: var(--white);
  opacity: 0;
  transform: translateY(60px) rotateX(90deg);
  animation: letterDrop 0.6s cubic-bezier(.22,1,.36,1) forwards;
  text-shadow: 0 0 20px rgba(0,229,255,0.6), 0 0 40px rgba(0,229,255,0.3);
}

/* Gold words */
.word-gold .slogan-letter {
  color: var(--gold);
  text-shadow: 0 0 20px rgba(255,215,0,0.8), 0 0 50px rgba(255,180,0,0.4);
}
/* Cyan words */
.word-cyan .slogan-letter {
  color: var(--cyan);
  text-shadow: 0 0 20px rgba(0,229,255,0.8), 0 0 50px rgba(0,229,255,0.4);
}
/* Red word */
.word-red .slogan-letter {
  color: #ff4b6a;
  text-shadow: 0 0 20px rgba(255,75,106,0.8), 0 0 50px rgba(255,23,68,0.4);
  animation: letterDrop 0.6s cubic-bezier(.22,1,.36,1) forwards, heartPulse 1.4s ease-in-out infinite;
}

@keyframes letterDrop {
  to { opacity: 1; transform: translateY(0) rotateX(0); }
}
@keyframes heartPulse {
  0%,100% { transform: scale(1); }
  50%      { transform: scale(1.08); }
}

/* Sub-slogan */
.slogan-sub {
  font-family: 'Cormorant Garamond', serif;
  font-style: italic;
  font-size: clamp(11px, 2.5vw, 18px);
  color: rgba(255,215,0,0.85);
  letter-spacing: 3px;
  opacity: 0;
  animation: fadeUp 1s ease forwards 3.8s;
  text-shadow: 0 0 15px rgba(255,180,0,0.5);
}

/* Bottom tag */
.slogan-tag {
  font-family: 'Rajdhani', sans-serif;
  font-size: clamp(8px, 1.6vw, 12px);
  letter-spacing: clamp(4px,1.5vw,10px);
  color: rgba(255,255,255,0.3);
  text-transform: uppercase;
  opacity: 0;
  animation: fadeUp 1s ease forwards 4.5s;
}

@keyframes fadeUp {
  from { opacity:0; transform: translateY(20px); }
  to   { opacity:1; transform: translateY(0); }
}

/* ── TOP LABEL ── */
.top-label {
  position: absolute;
  top: 4%; left: 0; right: 0;
  text-align: center;
  z-index: 10;
}
.top-label .badge {
  display: inline-block;
  font-family: 'Rajdhani', sans-serif;
  font-size: clamp(9px,1.8vw,13px);
  font-weight: 700;
  letter-spacing: clamp(3px,1.2vw,8px);
  color: var(--cyan);
  text-transform: uppercase;
  border: 1px solid rgba(0,229,255,0.4);
  padding: clamp(3px,0.8vw,6px) clamp(10px,2vw,20px);
  border-radius: 30px;
  background: rgba(0,229,255,0.05);
  opacity: 0;
  animation: fadeUp 1s ease forwards 0.2s;
}

/* ── NURSES heading ── */
.nurses-heading {
  position: absolute;
  top: 11%;
  left: 0; right: 0;
  text-align: center;
  z-index: 10;
}
.nurses-heading h1 {
  font-family: 'Cinzel Decorative', serif;
  font-size: clamp(28px, 7vw, 56px);
  font-weight: 900;
  color: white;
  line-height: 1;
  opacity: 0;
  transform: scale(0.7);
  animation: heroReveal 1s cubic-bezier(.22,1,.36,1) forwards 0.6s;
  letter-spacing: -1px;
}
.nurses-heading h1 span {
  color: var(--cyan);
  display: inline-block;
  text-shadow: 0 0 30px rgba(0,229,255,0.7), 0 0 80px rgba(0,229,255,0.3);
}
.nurses-heading .sub {
  font-family: 'Cormorant Garamond', serif;
  font-style: italic;
  font-size: clamp(13px,2.8vw,22px);
  color: rgba(255,215,0,0.9);
  letter-spacing: 4px;
  opacity: 0;
  animation: fadeUp 1s ease forwards 1.2s;
  margin-top: 4px;
}
@keyframes heroReveal {
  to { opacity:1; transform: scale(1); }
}

/* ── FLOATING PARTICLES via JS ── */
.p-star {
  position: absolute;
  border-radius: 50%;
  pointer-events: none;
  z-index: 4;
}

/* ── GLOW PULSE on nurse ── */
.nurse-glow {
  position: absolute;
  bottom: 22%;
  left: 50%;
  transform: translateX(-50%);
  width: 58%;
  aspect-ratio: 1;
  border-radius: 50%;
  background: radial-gradient(ellipse, rgba(0,229,255,0.18) 0%, transparent 70%);
  animation: glowBreath 3s ease-in-out infinite;
  z-index: 4;
}
@keyframes glowBreath {
  0%,100% { transform: translateX(-50%) scale(1); opacity:0.7; }
  50%      { transform: translateX(-50%) scale(1.15); opacity:1; }
}

/* ── MEDALS / STARS decorative ── */
.deco-stars {
  position: absolute;
  top: 0; left: 0; right: 0; bottom: 0;
  z-index: 3;
  pointer-events: none;
}
</style>
</head>

    <g style="animation: heartFloat 3s ease-in-out infinite 1s; transform-origin:295px 220px">
      <path d="M290 215 C290 211 294 207 298 211 C302 207 306 211 306 215 C306 221 298 227 298 227 C298 227 290 221 290 215Z" fill="#ff4b6a" opacity="0.6"/>

    <!-- Child silhouette -->

  <div class="slogan-section">
    <div class="slogan-main" id="sloganMain"></div>
    <div class="slogan-sub">— Empowered Nurses Save Lives —</div>
    <div class="slogan-tag">Nurses · Our Future · Our Heroes</div>
  </div>

<script>
/* ── Particle background ── */
const canvas = document.getElementById('particles');
const ctx = canvas.getContext('2d');
canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

const particles = Array.from({length: 80}, () => ({
  x: Math.random() * canvas.width,
  y: Math.random() * canvas.height,
  r: Math.random() * 1.8 + 0.4,
  dx: (Math.random() - 0.5) * 0.4,
  dy: -Math.random() * 0.5 - 0.2,
  alpha: Math.random(),
  color: Math.random() > 0.5 ? '0,229,255' : '255,215,0',
}));

function animParticles() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  particles.forEach(p => {
    p.x += p.dx; p.y += p.dy;
    p.alpha += (Math.random() - 0.5) * 0.03;
    p.alpha = Math.max(0.1, Math.min(1, p.alpha));
    if(p.y < 0) p.y = canvas.height;
    if(p.x < 0) p.x = canvas.width;
    if(p.x > canvas.width) p.x = 0;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.r, 0, Math.PI*2);
    ctx.fillStyle = `rgba(${p.color},${p.alpha})`;
    ctx.fill();
  });
  requestAnimationFrame(animParticles);
}
animParticles();

/* ── Letter-by-letter slogan ── */
const sloganWords = [
  { text: 'EMPOWERED', cls: 'word-gold' },
  { text: 'NURSES',    cls: 'word-cyan' },
  { text: 'SAVE',      cls: 'word-white'},
  { text: 'LIVES',     cls: 'word-red'  },
];

const container = document.getElementById('sloganMain');
let baseDelay = 1800; // ms from page load

sloganWords.forEach(word => {
  const wordEl = document.createElement('span');
  wordEl.className = `word-block ${word.cls}`;
  [...word.text].forEach((char, i) => {
    const span = document.createElement('span');
    span.className = 'slogan-letter';
    span.textContent = char;
    span.style.animationDelay = `${baseDelay + i * 60}ms`;
    wordEl.appendChild(span);
  });
  container.appendChild(wordEl);
  baseDelay += word.text.length * 60 + 180;
});

window.addEventListener('resize', () => {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
});
</script>
</body>
