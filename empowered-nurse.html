<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Empowered Nurses – Our Future</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Lato:wght@300;400&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #0a0e1a;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    font-family: 'Lato', sans-serif;
  }

  .poster {
    position: relative;
    width: 600px;
    height: 820px;
    background: linear-gradient(160deg, #040d2e 0%, #0d2060 40%, #0a3d62 100%);
    border-radius: 12px;
    overflow: hidden;
    box-shadow: 0 0 80px rgba(0,180,255,0.25), 0 0 200px rgba(0,100,200,0.15);
  }

  /* Star field */
  .stars {
    position: absolute;
    inset: 0;
    background-image:
      radial-gradient(1px 1px at 10% 15%, white, transparent),
      radial-gradient(1px 1px at 25% 5%, white, transparent),
      radial-gradient(1.5px 1.5px at 40% 20%, white, transparent),
      radial-gradient(1px 1px at 60% 8%, white, transparent),
      radial-gradient(1px 1px at 75% 18%, white, transparent),
      radial-gradient(1.5px 1.5px at 88% 10%, white, transparent),
      radial-gradient(1px 1px at 5% 35%, rgba(255,255,255,0.6), transparent),
      radial-gradient(1px 1px at 95% 30%, rgba(255,255,255,0.6), transparent),
      radial-gradient(1px 1px at 50% 3%, rgba(255,255,255,0.8), transparent);
    opacity: 0.8;
    animation: twinkle 4s ease-in-out infinite alternate;
  }
  @keyframes twinkle {
    from { opacity: 0.6; }
    to { opacity: 1; }
  }

  /* Ground glow */
  .ground-glow {
    position: absolute;
    bottom: 0; left: 50%;
    transform: translateX(-50%);
    width: 500px; height: 200px;
    background: radial-gradient(ellipse at center bottom, rgba(0,220,255,0.18) 0%, transparent 70%);
  }

  /* Radiant rays behind nurse */
  .rays {
    position: absolute;
    bottom: 160px; left: 50%;
    transform: translateX(-50%);
    width: 460px; height: 460px;
    animation: spinRays 30s linear infinite;
  }
  @keyframes spinRays { to { transform: translateX(-50%) rotate(360deg); } }

  /* Text */
  .top-text {
    position: absolute;
    top: 36px; left: 0; right: 0;
    text-align: center;
    z-index: 10;
  }
  .top-text h1 {
    font-family: 'Playfair Display', serif;
    font-size: 13px;
    letter-spacing: 8px;
    color: rgba(100,210,255,0.85);
    text-transform: uppercase;
    margin-bottom: 6px;
  }
  .top-text h2 {
    font-family: 'Playfair Display', serif;
    font-size: 34px;
    font-weight: 900;
    color: #ffffff;
    line-height: 1.1;
    text-shadow: 0 0 30px rgba(0,200,255,0.5);
  }
  .top-text h2 span {
    color: #00e5ff;
  }

  .bottom-text {
    position: absolute;
    bottom: 38px; left: 0; right: 0;
    text-align: center;
    z-index: 10;
  }
  .bottom-text p {
    font-family: 'Playfair Display', serif;
    font-size: 18px;
    font-style: italic;
    color: rgba(255,220,100,0.9);
    text-shadow: 0 0 20px rgba(255,200,0,0.4);
    letter-spacing: 1px;
  }
  .bottom-text small {
    display: block;
    margin-top: 8px;
    font-size: 11px;
    letter-spacing: 5px;
    color: rgba(255,255,255,0.35);
    text-transform: uppercase;
  }

  svg.illustration {
    position: absolute;
    bottom: 100px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 5;
  }

  /* Pulse animation on heart */
  .heart-pulse {
    animation: pulse 1.4s ease-in-out infinite;
    transform-origin: center;
  }
  @keyframes pulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.15); }
  }

  /* Glow animation on halo/cross */
  .glow-anim {
    animation: glowPulse 2s ease-in-out infinite alternate;
  }
  @keyframes glowPulse {
    from { filter: drop-shadow(0 0 6px rgba(0,220,255,0.6)); }
    to { filter: drop-shadow(0 0 18px rgba(0,220,255,1)); }
  }

  /* Wing float */
  .wing-left {
    animation: wingFloat 3s ease-in-out infinite alternate;
    transform-origin: 230px 270px;
  }
  .wing-right {
    animation: wingFloat 3s ease-in-out infinite alternate-reverse;
    transform-origin: 370px 270px;
  }
  @keyframes wingFloat {
    from { transform: rotate(-4deg); }
    to { transform: rotate(4deg); }
  }

  /* Heartbeat line draw */
  .hb-line {
    stroke-dasharray: 400;
    stroke-dashoffset: 400;
    animation: drawLine 2.5s ease forwards 0.5s;
  }
  @keyframes drawLine {
    to { stroke-dashoffset: 0; }
  }

  /* Stars sparkle */
  .sparkle {
    animation: sparkleAnim 2s ease-in-out infinite;
  }
  .sparkle:nth-child(2) { animation-delay: 0.4s; }
  .sparkle:nth-child(3) { animation-delay: 0.8s; }
  .sparkle:nth-child(4) { animation-delay: 1.2s; }
  @keyframes sparkleAnim {
    0%, 100% { opacity: 0.3; transform: scale(0.8); }
    50% { opacity: 1; transform: scale(1.3); }
  }
</style>
</head>
<body>
<div class="poster">
  <div class="stars"></div>
  <div class="ground-glow"></div>

  <!-- Radiant rays SVG -->
  <svg class="rays" viewBox="0 0 460 460" fill="none" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <radialGradient id="rayGrad" cx="50%" cy="50%" r="50%">
        <stop offset="0%" stop-color="#00e5ff" stop-opacity="0.12"/>
        <stop offset="100%" stop-color="#00e5ff" stop-opacity="0"/>
      </radialGradient>
    </defs>
    <!-- 12 rays -->
    <g opacity="0.7">
      <polygon points="230,230 215,10 245,10" fill="url(#rayGrad)"/>
      <polygon points="230,230 420,120 430,148" fill="url(#rayGrad)"/>
      <polygon points="230,230 450,215 450,245" fill="url(#rayGrad)"/>
      <polygon points="230,230 420,340 410,365" fill="url(#rayGrad)"/>
      <polygon points="230,230 245,450 215,450" fill="url(#rayGrad)"/>
      <polygon points="230,230 40,350 30,325" fill="url(#rayGrad)"/>
      <polygon points="230,230 10,245 10,215" fill="url(#rayGrad)"/>
      <polygon points="230,230 40,120 50,95" fill="url(#rayGrad)"/>
      <polygon points="230,230 148,20 175,12" fill="url(#rayGrad)"/>
      <polygon points="230,230 312,18 330,30" fill="url(#rayGrad)"/>
      <polygon points="230,230 438,170 445,198" fill="url(#rayGrad)"/>
      <polygon points="230,230 15,170 12,145" fill="url(#rayGrad)"/>
    </g>
  </svg>

  <!-- Top Text -->
  <div class="top-text">
    <h1>Drawing Competition</h1>
    <h2>Empowered <span>Nurses</span><br/>Our Future</h2>
  </div>

  <!-- Main Nurse Illustration SVG -->
  <svg class="illustration" width="420" height="480" viewBox="0 0 420 480" fill="none" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <radialGradient id="bodyGlow" cx="50%" cy="50%" r="50%">
        <stop offset="0%" stop-color="#00e5ff" stop-opacity="0.15"/>
        <stop offset="100%" stop-color="#00e5ff" stop-opacity="0"/>
      </radialGradient>
      <radialGradient id="skinGrad" cx="50%" cy="30%" r="60%">
        <stop offset="0%" stop-color="#f4c08a"/>
        <stop offset="100%" stop-color="#d4854a"/>
      </radialGradient>
      <linearGradient id="uniformGrad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#ffffff"/>
        <stop offset="100%" stop-color="#d0eaf7"/>
      </linearGradient>
      <linearGradient id="capeGrad" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0%" stop-color="#00bcd4"/>
        <stop offset="100%" stop-color="#006080"/>
      </linearGradient>
      <linearGradient id="wingGrad" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9"/>
        <stop offset="100%" stop-color="#a0e8ff" stop-opacity="0.4"/>
      </linearGradient>
      <filter id="softGlow">
        <feGaussianBlur stdDeviation="4" result="blur"/>
        <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
      </filter>
      <filter id="strongGlow">
        <feGaussianBlur stdDeviation="8" result="blur"/>
        <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
      </filter>
    </defs>

    <!-- Body glow background -->
    <ellipse cx="210" cy="300" rx="160" ry="180" fill="url(#bodyGlow)"/>

    <!-- ===== LEFT WING ===== -->
    <g class="wing-left">
      <!-- Main wing shape -->
      <path d="M185 260 C160 230 100 200 60 170 C40 158 20 165 30 185 C50 215 100 240 150 260 C165 266 180 268 185 260Z"
            fill="url(#wingGrad)" opacity="0.85" filter="url(#softGlow)"/>
      <!-- Wing feather lines -->
      <path d="M175 262 C140 240 90 215 55 190" stroke="rgba(200,240,255,0.6)" stroke-width="1.2" fill="none"/>
      <path d="M175 270 C145 255 100 235 70 215" stroke="rgba(200,240,255,0.5)" stroke-width="1" fill="none"/>
      <path d="M178 256 C155 228 115 205 75 182" stroke="rgba(200,240,255,0.5)" stroke-width="1" fill="none"/>
      <!-- Lower wing -->
      <path d="M185 275 C155 260 105 258 70 270 C50 278 45 295 65 298 C100 303 155 285 185 278Z"
            fill="url(#wingGrad)" opacity="0.7"/>
      <!-- Tip glow dots -->
      <circle cx="32" cy="180" r="3" fill="#00e5ff" opacity="0.8"/>
      <circle cx="48" cy="168" r="2" fill="#ffffff" opacity="0.9"/>
    </g>

    <!-- ===== RIGHT WING ===== -->
    <g class="wing-right">
      <path d="M235 260 C260 230 320 200 360 170 C380 158 400 165 390 185 C370 215 320 240 270 260 C255 266 240 268 235 260Z"
            fill="url(#wingGrad)" opacity="0.85" filter="url(#softGlow)"/>
      <path d="M245 262 C280 240 330 215 365 190" stroke="rgba(200,240,255,0.6)" stroke-width="1.2" fill="none"/>
      <path d="M245 270 C275 255 320 235 350 215" stroke="rgba(200,240,255,0.5)" stroke-width="1" fill="none"/>
      <path d="M242 256 C265 228 305 205 345 182" stroke="rgba(200,240,255,0.5)" stroke-width="1" fill="none"/>
      <path d="M235 275 C265 260 315 258 350 270 C370 278 375 295 355 298 C320 303 265 285 235 278Z"
            fill="url(#wingGrad)" opacity="0.7"/>
      <circle cx="388" cy="180" r="3" fill="#00e5ff" opacity="0.8"/>
      <circle cx="372" cy="168" r="2" fill="#ffffff" opacity="0.9"/>
    </g>

    <!-- ===== CAPE ===== -->
    <path d="M165 230 C150 270 140 330 135 400 C133 420 145 430 155 415 C175 380 200 340 210 320 C220 340 245 380 265 415 C275 430 287 420 285 400 C280 330 270 270 255 230 C240 220 225 218 210 218 C195 218 180 220 165 230Z"
          fill="url(#capeGrad)" opacity="0.9"/>
    <!-- Cape highlight -->
    <path d="M200 225 C200 260 200 310 205 340" stroke="rgba(255,255,255,0.3)" stroke-width="2" fill="none"/>

    <!-- ===== BODY / UNIFORM ===== -->
    <!-- Torso -->
    <rect x="175" y="218" width="70" height="120" rx="12" fill="url(#uniformGrad)"/>
    <!-- Collar -->
    <path d="M195 218 L210 235 L225 218" fill="#cce8f4" stroke="#aad4ec" stroke-width="1"/>

    <!-- Red cross on chest -->
    <g class="glow-anim">
      <rect x="205" y="240" width="10" height="28" rx="2" fill="#e53935"/>
      <rect x="198" y="248" width="24" height="10" rx="2" fill="#e53935"/>
    </g>

    <!-- ===== ARMS ===== -->
    <!-- Left arm (raised slightly) -->
    <path d="M175 230 C155 240 140 250 128 240" stroke="#d4854a" stroke-width="18" stroke-linecap="round" fill="none"/>
    <!-- Left hand -->
    <ellipse cx="126" cy="238" rx="12" ry="10" fill="#f4c08a"/>
    <!-- Stethoscope in left hand -->
    <g filter="url(#softGlow)">
      <path d="M128 236 C118 220 108 200 115 185 C120 174 132 172 140 178 C148 184 148 196 145 205" 
            stroke="#ffd54f" stroke-width="3" fill="none" stroke-linecap="round"/>
      <circle cx="145" cy="208" r="8" fill="none" stroke="#ffd54f" stroke-width="3"/>
      <circle cx="145" cy="208" r="4" fill="#ffd54f" opacity="0.7"/>
      <!-- Glow on stethoscope head -->
      <circle cx="145" cy="208" r="10" fill="rgba(255,213,79,0.2)"/>
    </g>

    <!-- Right arm (pointing up/out) -->
    <path d="M245 230 C265 225 278 215 290 205" stroke="#d4854a" stroke-width="18" stroke-linecap="round" fill="none"/>
    <!-- Right hand -->
    <ellipse cx="292" cy="203" rx="12" ry="10" fill="#f4c08a"/>
    <!-- Lamp / light in right hand -->
    <g filter="url(#softGlow)">
      <!-- Lamp body -->
      <ellipse cx="296" cy="196" rx="9" ry="14" fill="#ffd54f"/>
      <!-- Lamp glow -->
      <ellipse cx="296" cy="190" rx="20" ry="25" fill="rgba(255,220,50,0.18)"/>
      <ellipse cx="296" cy="185" rx="30" ry="35" fill="rgba(255,220,50,0.08)"/>
      <!-- Lamp handle -->
      <rect x="292" y="208" width="8" height="14" rx="3" fill="#f0b429"/>
      <!-- Light rays -->
      <line x1="296" y1="160" x2="296" y2="148" stroke="#ffd54f" stroke-width="2" stroke-linecap="round"/>
      <line x1="310" y1="165" x2="318" y2="156" stroke="#ffd54f" stroke-width="2" stroke-linecap="round"/>
      <line x1="282" y1="165" x2="274" y2="156" stroke="#ffd54f" stroke-width="2" stroke-linecap="round"/>
      <line x1="315" y1="178" x2="326" y2="174" stroke="#ffd54f" stroke-width="1.5" stroke-linecap="round"/>
      <line x1="277" y1="178" x2="266" y2="174" stroke="#ffd54f" stroke-width="1.5" stroke-linecap="round"/>
    </g>

    <!-- ===== HEAD ===== -->
    <!-- Neck -->
    <rect x="200" y="192" width="20" height="28" rx="6" fill="#f4c08a"/>
    <!-- Head -->
    <ellipse cx="210" cy="165" rx="38" ry="42" fill="url(#skinGrad)"/>
    <!-- Nurse cap -->
    <path d="M172 155 C175 128 185 115 210 112 C235 115 245 128 248 155Z" fill="#ffffff"/>
    <rect x="172" y="150" width="76" height="10" rx="3" fill="#ffffff"/>
    <!-- Cap red cross -->
    <g class="glow-anim">
      <rect x="206" y="126" width="8" height="20" rx="1.5" fill="#e53935"/>
      <rect x="200" y="132" width="20" height="8" rx="1.5" fill="#e53935"/>
    </g>
    <!-- Hair -->
    <path d="M172 165 C170 148 175 132 185 122" stroke="#5d3a1a" stroke-width="8" fill="none" stroke-linecap="round"/>
    <path d="M248 165 C250 148 245 132 235 122" stroke="#5d3a1a" stroke-width="8" fill="none" stroke-linecap="round"/>
    <!-- Eyes -->
    <ellipse cx="196" cy="162" rx="5" ry="6" fill="#2c1a0e"/>
    <ellipse cx="224" cy="162" rx="5" ry="6" fill="#2c1a0e"/>
    <circle cx="198" cy="160" r="1.8" fill="white"/>
    <circle cx="226" cy="160" r="1.8" fill="white"/>
    <!-- Smile -->
    <path d="M198 176 Q210 184 222 176" stroke="#c0704a" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <!-- Cheeks -->
    <circle cx="188" cy="172" r="8" fill="#ff8a80" opacity="0.25"/>
    <circle cx="232" cy="172" r="8" fill="#ff8a80" opacity="0.25"/>

    <!-- ===== HALO / GLOW RING ===== -->
    <ellipse cx="210" cy="115" rx="45" ry="8" fill="none" stroke="#00e5ff" stroke-width="2.5" opacity="0.7" class="glow-anim"/>

    <!-- ===== LEGS ===== -->
    <path d="M192 336 L185 420" stroke="#d4854a" stroke-width="20" stroke-linecap="round" fill="none"/>
    <path d="M228 336 L235 420" stroke="#d4854a" stroke-width="20" stroke-linecap="round" fill="none"/>
    <!-- Shoes -->
    <ellipse cx="182" cy="424" rx="18" ry="10" fill="#1a237e"/>
    <ellipse cx="238" cy="424" rx="18" ry="10" fill="#1a237e"/>
    <!-- White scrub pants showing -->
    <path d="M192 336 L190 380" stroke="#d0eaf7" stroke-width="14" stroke-linecap="round" fill="none"/>
    <path d="M228 336 L230 380" stroke="#d0eaf7" stroke-width="14" stroke-linecap="round" fill="none"/>

    <!-- ===== HEARTBEAT LINE ===== -->
    <g filter="url(#softGlow)">
      <path class="hb-line"
        d="M30 460 L80 460 L95 440 L110 480 L125 430 L140 470 L155 460 L390 460"
        stroke="#00e5ff" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <!-- ===== SPARKLE STARS ===== -->
    <g class="sparkle">
      <path d="M60 100 L63 110 L73 110 L65 116 L68 126 L60 120 L52 126 L55 116 L47 110 L57 110Z" fill="#ffd54f" opacity="0.9"/>
    </g>
    <g class="sparkle">
      <path d="M350 80 L352 87 L359 87 L354 91 L356 98 L350 94 L344 98 L346 91 L341 87 L348 87Z" fill="#ffd54f" opacity="0.85"/>
    </g>
    <g class="sparkle">
      <path d="M380 200 L381.5 205 L387 205 L383 208 L384.5 213 L380 210 L375.5 213 L377 208 L373 205 L378.5 205Z" fill="#00e5ff" opacity="0.9"/>
    </g>
    <g class="sparkle">
      <path d="M40 300 L41.5 305 L47 305 L43 308 L44.5 313 L40 310 L35.5 313 L37 308 L33 305 L38.5 305Z" fill="#ffffff" opacity="0.7"/>
    </g>

    <!-- Small floating hearts -->
    <g opacity="0.7" filter="url(#softGlow)" class="heart-pulse">
      <path d="M80 220 C80 215 85 210 90 215 C95 210 100 215 100 220 C100 228 90 235 90 235 C90 235 80 228 80 220Z" fill="#e53935"/>
    </g>
    <g opacity="0.5" style="animation: sparkleAnim 2.5s ease-in-out infinite 1s;">
      <path d="M330 310 C330 307 333 304 336 307 C339 304 342 307 342 310 C342 315 336 319 336 319 C336 319 330 315 330 310Z" fill="#ff4081"/>
    </g>

    <!-- Patients/people silhouettes at bottom -->
    <!-- Person 1 (child) -->
    <g opacity="0.5">
      <circle cx="100" cy="430" r="12" fill="#90caf9"/>
      <rect x="92" y="442" width="16" height="30" rx="5" fill="#90caf9"/>
    </g>
    <!-- Person 2 (elder) -->
    <g opacity="0.45">
      <circle cx="320" cy="425" r="14" fill="#a5d6a7"/>
      <rect x="311" y="439" width="18" height="32" rx="5" fill="#a5d6a7"/>
      <line x1="305" y1="455" x2="318" y2="445" stroke="#a5d6a7" stroke-width="3" stroke-linecap="round"/>
    </g>
    <!-- Stars around them -->
    <circle cx="95" cy="415" r="2" fill="#ffd54f" opacity="0.6"/>
    <circle cx="325" cy="412" r="2" fill="#ffd54f" opacity="0.6"/>
  </svg>

  <!-- Bottom Text -->
  <div class="bottom-text">
    <p>"Empowered Nurses Save Lives"</p>
    <small>Nurses · Our Future · Our Heroes</small>
  </div>
</div>
</body>
</html>
